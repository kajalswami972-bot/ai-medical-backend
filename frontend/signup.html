<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Assistant - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Top Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">📶 🔋</div>
        </div>

        <!-- Back Button & Header -->
        <div class="login-header">
            <a href="welcome.html" class="back-arrow">←</a>
            <h2>Sign Up</h2>
        </div>

        <!-- Sign Up Form -->
        <div class="form-container" style="gap: 15px;"> <!-- Form fields ke beech thoda kam gap taaki screen me fit ho -->
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your number">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create password">
            </div>

            <button class="btn btn-primary" style="margin-top: 10px;">Sign Up</button>

            <p class="switch-auth">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

</body>
</html>
